name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: ويب (typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mila-web
          path: dist
          if-no-files-found: error

  apk:
    name: APK (Android)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - name: تجهيز الأيقونات من SVG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 resources/icon-source.svg -o resources/icon.png
      - run: npm ci
      - name: توليد أيقونات أندرويد
        run: |
          npx @capacitor/assets generate --android --iconBackgroundColor "#fdf6e9" --assetPath resources
          # الأيقونة التكيفية (adaptive) محفوظة بالمسارات الصحيحة في المستودع: ما نسمح بالكتابة عليها.
          git checkout -- android/app/src/main/res/mipmap-anydpi-v26
      - run: npm run build
      - run: npx cap sync android
      - name: فحص مفتاح التوقيع
        id: keycheck
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: فك مفتاح التوقيع
        if: steps.keycheck.outputs.present == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
            echo "ANDROID_KEY_ALIAS=$KS_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
      - name: بناء APK
        run: |
          chmod +x android/gradlew
          cd android
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi
      - name: تجهيز الملف
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk mila.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk mila.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mila-apk
          path: mila.apk
          if-no-files-found: error

  release:
    name: نشر على GitHub Releases
    runs-on: ubuntu-latest
    needs: apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mila-apk
      - name: رفع الـ APK على الـ Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          FILE="studybuddy-$TAG.apk"
          mv mila.apk "$FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "StudyBuddy $TAG" --target "$GITHUB_SHA" \
              --notes "نسخة جديدة من StudyBuddy. حمّل ملف APK من تحت وثبّتو على الموبايل."
          fi
