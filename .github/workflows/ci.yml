name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: ويب (typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: studybuddy-web
          path: dist
          if-no-files-found: error

  apk:
    name: APK (Android)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: فحص مفتاح التوقيع
        id: keycheck
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: فك مفتاح التوقيع
        if: steps.keycheck.outputs.present == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # أي مسافة أو سطر زيادة بالأسرار (مثلاً CRLF من ويندوز) ما بتأثّر.
          echo "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          KS_PASS=$(printf %s "$KS_PASS" | tr -d '\r\n')
          KS_ALIAS=$(printf %s "$KS_ALIAS" | tr -d '\r\n')
          KEY_PASS=$(printf %s "$KEY_PASS" | tr -d '\r\n')
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
            echo "ANDROID_KEY_ALIAS=$KS_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
      - name: بناء APK
        run: |
          chmod +x android/gradlew
          cd android
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi
      - name: تجهيز الملف وفحصو
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk studybuddy.apk
          else
            echo "::warning::ما في مفتاح توقيع: الـAPK موقّع بمفتاح debug مؤقت وما بينحدّث فوق نسخة تانية."
            cp android/app/build/outputs/apk/debug/app-debug.apk studybuddy.apk
          fi
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt2" dump badging studybuddy.apk | head -1
          "$BT/apksigner" verify --print-certs studybuddy.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: studybuddy-apk
          path: studybuddy.apk
          if-no-files-found: error

  release:
    name: نشر على GitHub Releases
    runs-on: ubuntu-latest
    needs: apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: studybuddy-apk
      - name: رفع الـ APK على الـ Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          FILE="studybuddy-$TAG.apk"
          mv studybuddy.apk "$FILE"
          NOTES="docs/release-notes/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" "$FILE" --title "StudyBuddy $TAG" --target "$GITHUB_SHA" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$FILE" --title "StudyBuddy $TAG" --target "$GITHUB_SHA" \
              --notes "نسخة جديدة من StudyBuddy. حمّل ملف APK من تحت وثبّتو على الموبايل. التحديث بيتثبّت فوق النسخة الحالية وبياناتك بتضل."
          fi
