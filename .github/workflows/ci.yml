name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: ويب (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mila-web
          path: dist
          if-no-files-found: error

  apk:
    name: APK (Android)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: بناء APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: تجهيز الملف
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mila.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mila-apk
          path: mila.apk
          if-no-files-found: error
